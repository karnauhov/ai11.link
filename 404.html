<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Handle SPA routing for GitHub Pages
    // When a route is directly accessed or page is refreshed, GitHub Pages returns 404
    // This script redirects to index.html while preserving the path
    
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    
    // Redirect to index.html with the original path preserved
    if (path !== '/' && !path.endsWith('index.html') && !path.endsWith('.html')) {
      // Store the path to be restored by the Flutter app
      sessionStorage.setItem('redirect', path + search + hash);
      window.location.replace('/index.html');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
